name: profile

on:
  schedule:
    # Daily, at an off-peak minute so the run is not queued behind the
    # top-of-hour rush on GitHub's shared schedulers.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Only source changes trigger a render. The job itself writes to assets/
    # and data/, which are excluded here so a render can never trigger itself.
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render panels
        env:
          # PROFILE_TOKEN is a personal access token and is what makes private
          # repositories countable. Without it the job still runs, using the
          # built-in token, and reports public activity only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          if git diff --cached --quiet; then
            echo 'nothing changed'
          else
            git commit -m 'chore: refresh profile telemetry'
            git push
          fi
